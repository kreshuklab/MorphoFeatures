[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphofeatures"
version = "0.2.0"
description = "Reproducible morphology embeddings from segmented 3D EM volumes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "MorphoFeatures contributors" }]
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "scipy>=1.9,<2",
  "scikit-learn>=1.2,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
workspace = [
  "torch>=2.1,<3",
  "streamlit>=1.40,<2",
  "matplotlib>=3.6,<4",
  "h5py>=3.8,<4",
  "zarr>=2.16,<3",
  "umap-learn>=0.5.3,<1",
  "trimesh>=4,<5",
  "plotly>=5,<7",
]
analysis = [
  "umap-learn>=0.5.3,<1",
  "networkx>=2.8,<4",
  "python-igraph>=0.10,<1",
  "leidenalg>=0.10,<1",
  "matplotlib>=3.6,<4",
  "seaborn>=0.12,<1",
  "h5py>=3.8,<4",
]
legacy-training = [
  "torch>=2.1,<3",
  "torch-cluster>=1.6,<2",
  "pytorch-metric-learning>=2.3,<3",
  "scikit-image>=0.21,<1",
  "trimesh>=4,<5",
  "zarr>=2.16,<3",
  "pybdv>=0.3,<1",
]
modern-training = [
  "torch>=2.1,<3",
  "einops>=0.7,<1",
]
gpu = [
  "torch>=2.1,<3",
]
ui = [
  "streamlit==1.12.0; python_full_version == '3.9.7'",
  "altair>=4,<5; python_full_version == '3.9.7'",
  "streamlit>=1.40,<2; python_full_version != '3.9.7'",
]
wandb = ["wandb>=0.16,<1"]
notebooks = [
  "jupyterlab>=4,<5",
  "nbformat>=5.9,<6",
  "nbclient>=0.9,<1",
  "ipykernel>=6,<7",
  "matplotlib>=3.6,<4",
]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
morphofeatures = "morphofeatures.cli:main"

[tool.setuptools.packages.find]
include = ["morphofeatures*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "optional: requires an optional dependency",
  "slow: longer-running scientific smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
