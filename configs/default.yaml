seed: 42
device: auto

# UI defaults for new DINO workflows; per-run paths remain editable.
# Configure these in Workspace settings or replace null with a local path.
dino:
  dinov2:
    model_repository: null  # Official checkout containing hubconf.py.
    weights_directory: null  # Optional base folder for checkpoint filenames.
    variant: dinov2_vits14
    checkpoints: {}  # Map exact architectures to files, e.g. dinov2_vits14: small.pth.
  dinov3:
    model_repository: null
    weights_directory: null
    variant: dinov3_vits16
    checkpoints: {}

paths:
  # Relative paths are resolved against the repository, never the shell cwd.
  repo_root: ..
  data_root: .
  analysis_data: analysis/data
  mobie_data: data_mobie
  output_root: outputs

data:
  coordinate_order: zyx
  resolution_unit: micrometer
  raw_volume: null
  cell_segmentation: null
  nucleus_segmentation: null
  cell_to_nucleus: null
  cell_table: null
  nucleus_table: null

slurm:
  # Replace in a deployment config or MORPHOFEATURES_SLURM_PROFILES.
  profiles: configs/slurm_profiles.example.yaml
