# CPU-bounded tutorial configuration. Generate the referenced crops with notebook 04 first.
# A scientific experiment should use a much larger, explicitly quality-controlled cohort.
seed: 42
device: cpu

paths:
  repo_root: ..
  output_root: outputs

data:
  crops: ../outputs/notebooks/04_platynereis_mae/preprocessed/crops.npy
  label_ids: ../outputs/notebooks/04_platynereis_mae/preprocessed/label_ids.npy
  loss_masks: ../outputs/notebooks/04_platynereis_mae/preprocessed/cell_masks.npy

mae:
  architecture_version: position-aware-3d-v2
  input_shape: [32, 32, 32]
  patch_size: [8, 8, 8]
  input_channels: 1
  embedding_dim: 32
  encoder_depth: 2
  encoder_heads: 4
  mask_ratio: 0.75

training:
  epochs: 10
  batch_size: 4
  learning_rate: 0.0003
  validation_fraction: 0.25

inference:
  batch_size: 8
