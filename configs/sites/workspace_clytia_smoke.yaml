# Bounded integration check only. Partial objects are explicitly allowed and
# marked truncated. Physical spacing is unavailable in these HDF5 attributes.
stages:
  - action: preprocess
    raw: /g/kreshuk/frazer/data/clytia_data/whole_raw_zarr/raw/cropped_clytia-raw_cropped.h5
    segmentation: /g/kreshuk/frazer/data/clytia_data/whole_raw_zarr/segmentations/cropped_clytia_3cube/cropped_clytia_segmentation_cropped.h5
    raw_key: exported_data
    segmentation_key: exported_data
    raw_axes: zyxc
    segmentation_axes: zyxc
    raw_channel: 0
    segmentation_channel: 0
    spacing_zyx: [1, 1, 1]
    origin_zyx: [0, 0, 0]
    unit: voxel
    roi: [[0, 0, 0], [64, 64, 64]]
    crop_shape: [16, 16, 16]
    block_shape: [32, 32, 32]
    max_objects: 4
    min_voxels: 10
    oversized: clip
    roi_boundary: allow
    boundary: pad
    normalization: dtype
    background: 0
  - action: train
    from_preprocessing: true
    config:
      seed: 42
      device: cpu
      mae:
        input_shape: [16, 16, 16]
        patch_size: [4, 4, 4]
        embedding_dim: 16
        encoder_heads: 4
        encoder_depth: 1
        mask_ratio: 0.5
      training:
        epochs: 1
        batch_size: 2
        learning_rate: 0.001
  - action: extract
    model: mae
    from_training: true
slurm:
  partition: compute
  cpus: 2
  gpus: 0
  memory: 4G
  time: '00:10:00'
