seed: 7
device: cpu

paths:
  repo_root: ..
  data_root: tests/fixtures/synthetic
  analysis_data: analysis/data
  mobie_data: data_mobie
  output_root: outputs/smoke

mae:
  architecture_version: position-aware-3d-v2
  input_shape: [8, 8, 8]
  patch_size: [4, 4, 4]
  embedding_dim: 16
  encoder_depth: 1
  encoder_heads: 4
  mask_ratio: 0.5

training:
  epochs: 1
  batch_size: 2
  learning_rate: 0.001
  validation_fraction: 0.25

inference:
  batch_size: 4
